# Test Profile Configuration
spring.application.name=cinesmart-test
spring.datasource.url=jdbc:h2:mem:cinesmart_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

cinesmart.jwt.secret=cinesmart-test-super-secret-key-32-bytes-minimum-length-for-hmac-sha256
cinesmart.jwt.expiration-ms=3600000
