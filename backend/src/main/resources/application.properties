# CineSmart Core Configuration
spring.application.name=cinesmart

# Server Port
server.port=8080

# Import local development overrides if present (strictly ignored in git)
spring.config.import=optional:classpath:application-local.properties

# Database DataSource (Configurable via Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/cinesmart}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=CineSmartHikariPool

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Security & JWT Configuration
cinesmart.jwt.secret=${JWT_SECRET:cinesmart-super-secret-key-32-bytes-minimum-length-for-hmac-sha256}
cinesmart.jwt.expiration-ms=86400000

# CORS Configuration
cinesmart.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Booking & Seat Lock Configuration
cinesmart.booking.lock-timeout-minutes=5

