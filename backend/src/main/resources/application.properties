# CineSmart Core Configuration
spring.application.name=cinesmart

# Server Port
server.port=8080

# Database DataSource (Configurable via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinesmart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=CineSmartHikariPool

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Security & JWT Configuration
cinesmart.jwt.secret=${JWT_SECRET:cinesmart-super-secret-key-32-bytes-minimum-length-for-hmac-sha256}
cinesmart.jwt.expiration-ms=86400000

# CORS Configuration
cinesmart.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
